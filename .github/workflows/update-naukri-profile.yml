name: Invoke Naukri Lambda

# Manual only — daily schedule is EventBridge Scheduler (Asia/Kolkata) on the Lambda.
# GitHub Actions cron is not used; it is often delayed or skipped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Naukri API changes)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  invoke-lambda:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      LAMBDA_FUNCTION_NAME: naukri-profile-updater

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke Mumbai Lambda
        id: invoke
        run: |
          set -euo pipefail
          DRY_RUN="false"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN="true"
          fi
          PAYLOAD=$(jq -nc --argjson dryRun "$DRY_RUN" '{dryRun: $dryRun}')
          aws lambda invoke \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            response.json
          echo "Lambda response:"
          cat response.json
          STATUS=$(jq -r '.statusCode // empty' response.json)
          SUCCESS=$(jq -r '.body.success // empty' response.json)
          if [ "$STATUS" = "500" ] || [ "$SUCCESS" = "false" ]; then
            echo "Lambda reported failure"
            exit 1
          fi
